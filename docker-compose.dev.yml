# Local development helpers. Mailpit catches every outgoing email (SMTP on 1025, web UI on 8025).
#   docker compose -f docker-compose.dev.yml up -d mailpit
services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: resume-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
