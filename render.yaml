# Render Blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: resume-app-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    region: frankfurt
    autoDeploy: true
    branch: main
    # No healthCheckPath: /healthz requires x-origin-secret (403 otherwise), and Render's checker cannot send it.
    envVars:
      - key: ORIGIN_SECRET
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Email (story 2.1). Without EMAIL_PROVIDER, EMAIL_FROM and PUBLIC_BASE_URL the server refuses to start outside Development.
      - key: EMAIL_PROVIDER
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: EMAIL_WORKER
        sync: false
      # Production hardening (docs/launch-checklist.md): the migrator role, used only to run migrations. Run server/db/roles.sql first. NOTE: DATABASE_URL below is bound to the database OWNER; after the first deploy set DATABASE_URL (app role) and DATABASE_URL_MIGRATOR (migrator role) by hand (docs/launch-checklist.md).
      - key: DATABASE_URL_MIGRATOR
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: resume-app-db
          property: connectionString

databases:
  - name: resume-app-db
    region: frankfurt
    plan: free

