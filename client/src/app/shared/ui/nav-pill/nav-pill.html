<nav [attr.aria-label]="strings.nav.ariaLabel">
  <ul>
    @for (item of items(); track item.id) {
      <li>
        @if (item.link !== undefined) {
          <a [routerLink]="item.link" [attr.aria-current]="item.id === activeId() ? 'page' : null">{{ item.label }}</a>
        } @else {
          <a [href]="item.href" [attr.aria-current]="item.id === activeId() ? 'page' : null">{{ item.label }}</a>
        }
      </li>
    }
  </ul>
</nav>
